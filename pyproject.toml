[project]
name = "domainshift-diagnostics-industrial"
version = "0.1.0"
description = "Modular framework for domain shift experiments in industrial condition monitoring"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
download = [
    "rarfile",
]
