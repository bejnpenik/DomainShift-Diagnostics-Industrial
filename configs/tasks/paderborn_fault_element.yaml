# Paderborn bearing fault element classification task
#
# Target: fault_element (normal vs inner ring vs outer ring)
# Simpler than CWRU — no class interactions needed.
# "all" keyword resolves to all available codes for that filter.

collection: paderborn
target: fault_element

domain_factors:
  - fault_size
  - fault_arrangement
  - condition
  - fault_combination
  - fault_mode
  - fault_characteristic

defaults:
  fixed:
    fault_size: 0
    fault_arrangement: 0
    condition: 0
    fault_combination: 0
    fault_mode: 0
    fault_characteristic: 0
  resolve:
    sampling_rate: all

classes:
  0:                              # 0 = normal
    fixed:
      fault_size: 0
      fault_arrangement: 0
      fault_combination: 0
      fault_mode: 0
      fault_characteristic: 0
    resolve:
      sampling_rate: all

filters:
  exclude:
    fault_size: [0, 4, 5]
    fault_mode: 0
    fault_characteristic: 0
    fault_combination: 0