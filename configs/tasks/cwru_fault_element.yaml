# CWRU bearing fault element classification task
#
# Target: fault_element (normal vs inner ring vs outer ring vs ball)
# Domain factors define what varies across domains — these become
# the axes of the pairwise experiment grid.
#
# Aliases (from configs/collections/cwru.yaml header):
#   bearing_position: FE, DE
#   condition:        C1 (0HP), C2 (1HP), C3 (2HP), C4 (3HP)
#   fault_size:       S0, S7, S14, S21, S28
#   fault_element:    NR (normal), IR (inner ring), OR (outer ring), BA (ball)
#   fault_position:   NR (normal), CE (centered), OG (orthogonal), OP (opposite), NA (unknown)
#   sampling_rate:    12k, 48k

collection: cwru
target: fault_element

domain_factors:
  - fault_size
  - bearing_position
  - condition

defaults:
  fixed:
    fault_size: S0
    bearing_position: FE
    condition: C1
  resolve:
    sampling_rate: [12k, 48k]
    fault_position: CE

classes:
  NR:
    fixed:
      fault_size: S0
    resolve:
      fault_position: NR
      sampling_rate: 48k
  IR:
    resolve:
      fault_position: NA   # unknown — inner-ring faults have no position designation
  BA:
    resolve:
      fault_position: NA   # unknown — ball faults have no position designation

class_interactions:
  IR:
    bearing_position:
      FE:
        sampling_rate: 12k
  OR:
    bearing_position:
      FE:
        sampling_rate: 12k
  BA:
    bearing_position:
      FE:
        sampling_rate: 12k

filters:
  exclude:
    fault_size: [S0, S28]
