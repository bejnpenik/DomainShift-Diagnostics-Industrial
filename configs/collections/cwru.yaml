download:
  base_url: https://engineering.case.edu/sites/default/files
  format: individual
  filename_template: "{file_id}.mat"
  skip: [101, 102, 103, 104]   # manually created healthy FE bearing files, not available online

code_schema:
  bearing_position: 100000
  condition: 1
  fault_size: 10000
  fault_element: 100
  fault_position: 1000
  sampling_rate: 10

dirname: data/cwru
filetype: mat
name: cwru
reader: configs/readers/cwru_reader.yaml

header:
  bearing_position:
    1: {name: fan end,   alias: FE, value: FE}
    2: {name: drive end, alias: DE, value: DE}
  condition:
    1: {name: "0HP 1797rpm", alias: C1, value: C1, load: 0, speed: 1797}
    2: {name: "1HP 1772rpm", alias: C2, value: C2, load: 1, speed: 1772}
    3: {name: "2HP 1750rpm", alias: C3, value: C3, load: 2, speed: 1750}
    4: {name: "3HP 1730rpm", alias: C4, value: C4, load: 3, speed: 1730}
  fault_size:
    0: {name: "0.000 in", alias: S0,  value: 0.000}
    1: {name: "0.007 in", alias: S7,  value: 0.007}
    2: {name: "0.014 in", alias: S14, value: 0.014}
    3: {name: "0.021 in", alias: S21, value: 0.021}
    4: {name: "0.028 in", alias: S28, value: 0.028}
  fault_element:
    0: {name: normal,     alias: NR, value: normal}
    1: {name: inner ring, alias: IR, value: inner ring}
    2: {name: outer ring, alias: OR, value: outer ring}
    3: {name: ball,       alias: BA, value: ball}
  fault_position:
    0: {name: normal,     alias: NR, value: normal}
    1: {name: centered,   alias: CE, value: centered}
    2: {name: orthogonal, alias: OG, value: orthogonal}
    3: {name: opposite,   alias: OP, value: opposite}
  sampling_rate:
    1: {name: 12000 Hz, alias: 12k, value: 12000}
    2: {name: 48000 Hz, alias: 48k, value: 48000}

