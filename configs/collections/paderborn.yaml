download:
  base_url: https://groups.uni-paderborn.de/kat/BearingDataCenter
  format: rar
  filename_template: "{subdirectory}.rar"

code_schema:
  condition: 10000000
  fault_arrangement: 100
  fault_characteristic: 10
  fault_combination: 1000
  fault_size: 100000
  fault_element: 1000000
  fault_mode: 10000
  sampling_rate: 1

dirname: data/paderborn
filetype: mat
name: paderborn
reader: configs/readers/paderborn_reader.yaml

channels:
  vibration:
    reader_channel: vibration
    sampling_rate: 64000
    unit: "ms-2"
    description: "Piezoelectric accelerometer, bearing housing"
  phase_current:
    reader_channel: phase_current_1
    sampling_rate: 64000
    unit: A
    description: "Motor phase current 1"
  phase_current_2:
    reader_channel: phase_current_2
    sampling_rate: 64000
    unit: A
    description: "Motor phase current 2"
  rpm:
    reader_channel: rpm
    sampling_rate: 4000
    unit: rpm
    description: "Rotational speed encoder"
  torque:
    reader_channel: torque
    sampling_rate: 4000
    unit: Nm
    description: "Torque transducer"
  force:
    reader_channel: force
    sampling_rate: 4000
    unit: N
    description: "Radial force on test bearing"

header:
  condition:
    1: {name: "N15 1500rpm 0.7Nm 1000N",  alias: N15,   value: N15,  force: 1000, load: 0.7, speed: 1500}
    2: {name: "N09 900rpm 0.7Nm 1000N",   alias: N09,   value: N09,  force: 1000, load: 0.7, speed: 900}
    3: {name: "N15L 1500rpm 0.1Nm 1000N", alias: N15L,  value: N15L, force: 1000, load: 0.1, speed: 1500}
    4: {name: "N15F 1500rpm 0.7Nm 400N",  alias: N15F,  value: N15F, force: 400,  load: 0.7, speed: 1500}
  fault_arrangement:
    0: {name: no repetition, alias: NR, value: no repetition}
    1: {name: random,        alias: RN, value: random}
  fault_characteristic:
    0: {name: none,         alias: "NO", value: none}
    1: {name: single point, alias: SP, value: single point}
    2: {name: distributed,  alias: DS, value: distributed}
  fault_combination:
    0: {name: none,   alias: "NO", value: none}
    1: {name: single, alias: S,  value: single}
    2: {name: repeat, alias: R,  value: repeat}
    3: {name: mixed,  alias: M,  value: mixed}
  fault_size:
    0: {name: "0", alias: S0, value: 0}
    1: {name: "1", alias: S1, value: 1}
    2: {name: "2", alias: S2, value: 2}
    3: {name: "3", alias: S3, value: 3}
    4: {name: "4", alias: S4, value: 4}
    5: {name: "5", alias: S5, value: 5}
  fault_element:
    0: {name: normal,     alias: NR, value: normal}
    1: {name: inner ring, alias: IR, value: inner ring}
    2: {name: outer ring, alias: OR, value: outer ring}
  fault_mode:
    0: {name: none,   alias: "NO",     value: none}
    1: {name: AEDM,   alias: AEDM,   value: AEDM}
    2: {name: AENG,   alias: AENG,   value: AENG}
    3: {name: ADRILL, alias: ADRILL, value: ADRILL}
    4: {name: FPITT,  alias: FPITT,  value: FPITT}
    5: {name: PDI,    alias: PDI,    value: PDI}
  sampling_rate:
    0: {name: 64000 Hz, alias: 64k, value: 64000}

