type: order_tracking
name: order_spect_64k

channels:
  vibration_reader_channel: vibration
  rpm_reader_channel: rpm
  vibration_sampling_rate: 64000
  rpm_sampling_rate: 4000

angular:
  target_orders: 512
  window_revolutions: 5.0
  window_overlap: 0.2

view:
  type: order_spectrogram
  n_fft: 256
  hop_length: 96
  win_length: 256

# Output shape: (N, 1, 129, 27)  — N windows × 1 ch × 129 order bins × 27 revolution frames
# Compatible with 2D CNN encoders expecting (N, 1, F, T).
