type: order_tracking
name: order_64k

channels:
  vibration_reader_channel: vibration
  rpm_reader_channel: rpm
  vibration_sampling_rate: 64000
  rpm_sampling_rate: 4000

angular:
  target_orders: 512
  window_revolutions: 5.0
  window_overlap: 0.2
  anti_alias: true
  nominal_speed_metadata_path: condition.speed

view:
  type: raw_order

# Output shape: (N, 1, 2560)  — N windows × 1 ch × (512 orders/rev × 5 rev)
