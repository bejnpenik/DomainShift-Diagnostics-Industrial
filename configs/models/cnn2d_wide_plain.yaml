name: cnn2d_wide_plain
type: 2d

encoder:
  - [conv, 1, 8, {k: [3,1], s: 1, p: [3,0]}]
  - [pool, {k: [2,1], s: [2,1], p: [1,0]}]
  - [dropout, 0.01]
  - [conv, 8, 16, {k: [3,1], s: 1, p: [2,0]}]
  - [pool, {k: [2,1], s: [2,1], p: [1,0]}]
  - [dropout, 0.01]
  - [conv, 16, 32, {k: 3, s: 2, p: 0}]
  - [pool, {k: 2, s: 2, p: 0}]

aggregator:
  type: adaptive
  levels: 1

head:
  depth: 1
  dropout: 0.1
  act: relu
