name: cnn1d_wide_se
type: 1d

encoder:
  - [conv, 1, 7, {k: 7, s: 1, p: 0}]
  - [se, {r: 2}]
  - [pool, {k: 2, s: 2, p: 1}]
  - [dropout, 0.01]
  - [conv, 7, 13, {k: 5, s: 1, p: 0}]
  - [se, {r: 2}]
  - [pool, {k: 2, s: 2, p: 1}]
  - [dropout, 0.01]
  - [conv, 13, 24, {k: 3, s: 1, p: 0}]
  - [se, {r: 2}]
  - [pool, {k: 2, s: 2, p: 1}]

aggregator:
  type: multihead
  levels: [16,4,1]

head:
  depth: 2
  dropout: 0.1
  act: relu
