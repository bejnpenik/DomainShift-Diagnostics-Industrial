name: cnn1d_wide_plain
type: 1d

encoder:
  - [conv, 1, 8, {k: 7, s: 1, p: 0}]
  - [pool, {k: 2, s: 2, p: 1}]
  - [dropout, 0.01]
  - [conv, 8, 16, {k: 5, s: 1, p: 0}]
  - [pool, {k: 2, s: 2, p: 1}]
  - [dropout, 0.01]
  - [conv, 16, 32, {k: 3, s: 1, p: 0}]
  - [pool, {k: 2, s: 2, p: 1}]

aggregator:
  type: adaptive
  levels: 1

head:
  depth: 1
  dropout: 0.1
  act: relu
