name: cnn1d_wide_res
type: 1d

encoder:
  - [res, 1, 4, {k: 7, s: 1, blocks: 1, act: relu}]
  - [pool, {k: 2, s: 2, p: 1}]
  - [dropout, 0.01]
  - [res, 4, 9, {k: 5, s: 1, blocks: 1, act: relu}]
  - [pool, {k: 2, s: 2, p: 1}]
  - [dropout, 0.01]
  - [res, 9, 16, {k: 3, s: 1, blocks: 1, act: relu}]
  - [pool, {k: 2, s: 2, p: 1}]

aggregator:
  type: adaptive
  levels: 1

head:
  depth: 1
  dropout: 0.1
  act: relu
