name: cnn2d_wide_se
type: 2d

encoder:
  - [conv, 1, 7, {k: [3,1], s: 1, p: [3,0]}]
  - [se, {r: 2}]
  - [pool, {k: [2,1], s: [2,1], p: [1,0]}]
  - [dropout, 0.01]
  - [conv, 7, 12, {k: [3,1], s: 1, p: [2,0]}]
  - [se, {r: 2}]
  - [pool, {k: [2,1], s: [2,1], p: [1,0]}]
  - [dropout, 0.01]
  - [conv, 12, 32, {k: 3, s: 2, p: 0}]
  - [se, {r: 2}]
  - [pool, {k: 2, s: 2, p: 0}]

aggregator:
  type: adaptive
  levels: 1

head:
  depth: 1
  dropout: 0.1
  act: relu
